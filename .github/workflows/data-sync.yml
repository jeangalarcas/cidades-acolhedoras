name: Sync de Dados — Diário

on:
  schedule:
    # Executa todo dia às 06:00 e 18:00 (horário de Brasília = UTC-3)
    - cron: '0 9,21 * * *'
  workflow_dispatch:

permissions:
  contents: write          # ← ADIÇÃO: dá ao GITHUB_TOKEN permissão de push

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Sincronizar dados ANA HidroWeb
        run: node scripts/fetch-data.js --source ana
        env:
          ANA_API_KEY: ${{ secrets.ANA_API_KEY }}
      - name: Sincronizar dados CEMADEN
        run: node scripts/fetch-data.js --source cemaden
        env:
          CEMADEN_API_KEY: ${{ secrets.CEMADEN_API_KEY }}
      - name: Sincronizar dados INMET
        run: node scripts/fetch-data.js --source inmet
      - name: Verificar alertas críticos
        run: node scripts/fetch-data.js --check-alerts
      - name: Commit dados atualizados
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: sync dados hidrometeorológicos [skip ci]'
          file_pattern: 'public/data/*.json'
