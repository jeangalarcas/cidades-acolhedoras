name: SACE — Verificar cotas de referência

# Mensalmente confere se os limiares oficiais gravados (cotas_referencia)
# ainda batem com os boletins do SGB. Nenhum valor é alterado
# automaticamente (limiar oficial exige revisão humana).
#
# O job FALHA de propósito — e o GitHub avisa por e-mail — quando:
#   • o boletim publica valor DIFERENTE do gravado (possivel_mudanca);
#   • a estação/célula não é encontrada no PDF (nao_localizada);
#   • o boletim não pôde ser baixado ou lido (erro).
# Quando o boletim lista a estação SEM o limiar ("#" = sem valor definido),
# não há valor publicado para comparar: o job passa e registra um AVISO
# (nao_verificavel) na página da execução — avisos não geram e-mail.
on:
  schedule:
    - cron: '0 7 1 * *'      # dia 1 de cada mês, 07:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar verificador
        run: |
          set -e
          curl -s --max-time 300 \
            "https://sga-api-1705.onrender.com/api/sace/verificar-cotas?chave=${{ secrets.ANA_SYNC_TOKEN }}" \
            -o resultado.json
          cat resultado.json
          echo
          python3 - << 'PY'
          import json, sys
          d = json.load(open('resultado.json'))
          if 'erro' in d:
              print('ERRO na verificação:', d['erro']); sys.exit(1)

          def linha(m):
              return f"{m['estacao']} ({m.get('codigo', '?')}): " + '; '.join(m.get('detalhes') or m.get('campos', []))

          problemas, avisos = 0, 0
          for b in d.get('bacias', []):
              mudancas = b.get('possivel_mudanca', [])
              perdidas = b.get('nao_localizada', [])
              sem_valor = b.get('nao_verificavel', [])
              ref = b.get('referencia')
              print(f"[{b['bacia']}]" + (f" boletim de {ref}:" if ref else '')
                    + f" {b['confirmadas']}/{b['estacoes']} confirmadas"
                    + (f" | ERRO: {b['erro']}" if b.get('erro') else ''))
              for m in mudancas:
                  print('   ✖ possível mudança:', linha(m))
                  print(f"::error title=SACE {b['bacia']} - possível mudança de limiar::{linha(m)}")
              for m in perdidas:
                  print('   ✖ não localizada:', linha(m))
                  print(f"::error title=SACE {b['bacia']} - estação não localizada no boletim::{linha(m)}")
              for m in sem_valor:
                  print('   ⚠ não verificável:', linha(m))
                  print(f"::warning title=SACE {b['bacia']} - limiar não verificável::{linha(m)}" + (f" [boletim de {ref}]" if ref else ''))
              avisos += len(sem_valor)
              conferidas = b['confirmadas'] + len(sem_valor)
              if b.get('erro') or mudancas or perdidas or conferidas < b['estacoes']:
                  problemas += 1
          if problemas > 0:
              print("\n⚠ Verificação incompleta ou com divergências — revisar!")
              sys.exit(1)          # falha proposital → GitHub notifica por e-mail
          if avisos > 0:
              print(f"\n✅ Nenhuma divergência. {avisos} limiar(es) sem valor publicado no boletim vigente — ver avisos.")
          else:
              print('\n✅ Todos os limiares confirmados nos boletins vigentes.')
          PY
