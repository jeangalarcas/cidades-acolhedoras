name: SACE — Verificar cotas de referência

# Mensalmente confere se os limiares oficiais gravados (cotas_referencia)
# ainda batem com os boletins do SGB. Se houver possível mudança, o job
# FALHA de propósito — e o GitHub avisa por e-mail. Nenhum valor é
# alterado automaticamente (limiar oficial exige revisão humana).
on:
  schedule:
    - cron: '0 7 1 * *'      # dia 1 de cada mês, 07:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar verificador
        run: |
          set -e
          curl -s --max-time 300 \
            "https://sga-api-1705.onrender.com/api/sace/verificar-cotas?chave=${{ secrets.ANA_SYNC_TOKEN }}" \
            -o resultado.json
          cat resultado.json
          python3 - << 'PY'
          import json, sys
          d = json.load(open('resultado.json'))
          if 'erro' in d:
              print('ERRO na verificação:', d['erro']); sys.exit(1)
          n = d.get('total_possivel_mudanca', 0)
          for b in d.get('bacias', []):
              print(f"[{b['bacia']}] {b['confirmadas']}/{b['estacoes']} confirmadas"
                    + (f" | ERRO: {b['erro']}" if b.get('erro') else ''))
              for m in b.get('possivel_mudanca', []):
                  print('   ⚠ possível mudança:', m['estacao'], m['campos'])
          if n > 0:
              print(f"\n⚠ {n} limiar(es) não confirmados — revisar boletins oficiais!")
              sys.exit(1)          # falha proposital → GitHub notifica por e-mail
          print('\n✅ Todos os limiares confirmados nos boletins vigentes.')
          PY