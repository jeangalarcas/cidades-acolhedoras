name: Backup — Banco de dados (Supabase)

# Backup lógico semanal (pg_dump) guardado como artefato do GitHub (90 dias).
# Restauração: baixar o artefato e rodar
#   psql "$SUPABASE_DB_URL" < sga-backup-YYYY-MM-DD.sql
on:
  schedule:
    - cron: '0 6 * * 0'      # domingos às 06:00 UTC (03:00 no RS)
  workflow_dispatch:          # permite rodar manualmente na aba Actions

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17 (compatível com o servidor Supabase)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          DATA=$(date -u +%F)
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --schema=public \
            --file="sga-backup-$DATA.sql"
          gzip "sga-backup-$DATA.sql"
          ls -lh sga-backup-*.sql.gz

      - name: Guardar artefato (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: sga-backup-${{ github.run_id }}
          path: sga-backup-*.sql.gz
          retention-days: 90