  <!-- Seletor de municÃ­pio (msel) -->
  <style>
    .msel-select{padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--font);background:var(--white)}
    .msel-item{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}

<body>

  <div id="app">
    <div id="loading-screen" style="
      position:fixed;inset:0;background:#1B3A2D;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:-apple-system,sans-serif;color:#fff;gap:16px;z-index:9999
    ">
      <div style="font-size:13px;font-weight:700;background:#4BAF82;padding:4px 12px;border-radius:4px;letter-spacing:.6px">SGA Â· v3</div>
      <div style="font-size:18px;font-weight:600">Cidades Acolhedoras</div>
      <div style="font-size:12px;color:rgba(255,255,255,.55)">Rio Grande do Sul Â· 497 MunicÃ­pios</div>
      <div style="width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden;margin-top:8px">
        <div id="load-bar" style="height:100%;background:#4BAF82;border-radius:2px;width:0%;transition:width .4s"></div>
      </div>
      <div id="load-msg" style="font-size:11px;color:rgba(255,255,255,.45)">Inicializando...</div>
    </div>
  </div>

  <script>
    var bar = document.getElementById('load-bar');
    var msg = document.getElementById('load-msg');
    var steps = [[20,'Carregando...'],[45,'Mapa OSM...'],[65,'ANA HidroWeb...'],[80,'Sensores...'],[95,'Alertas...'],[100,'Pronto!']];
    var i = 0;
    var iv = setInterval(function() {
      if (i < steps.length) {
        if (bar) bar.style.width = steps[i][0] + '%';
        if (msg) msg.textContent = steps[i][1];
        i++;
      } else {
        clearInterval(iv);
        setTimeout(function() {
          var ls = document.getElementById('loading-screen');
          if (ls) { ls.style.opacity='0'; ls.style.transition='opacity .4s'; setTimeout(function(){ if(ls.parentNode) ls.parentNode.removeChild(ls); }, 400); }
        }, 300);
      }
    }, 280);
  </script>
